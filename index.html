<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f8ff">
  <title>算術小勇者｜數學闖關</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #20334c;
      --muted: #71839b;
      --blue: #4078ef;
      --green: #26a879;
      --paper: #fff;
      --line: #e7edf5;
      --shadow: 0 18px 50px rgba(61, 94, 140, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 36px;
      color: var(--ink);
      font-family: "Nunito", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 8% 6%, rgba(255, 224, 160, .34), transparent 30%),
        radial-gradient(ellipse at 93% 20%, rgba(171, 223, 255, .35), transparent 29%),
        #f3f8ff;
    }
    button { font: inherit; }
    .shell { width: min(1100px, 100%); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0 3px 18px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid; place-items: center; width: 48px; height: 48px; flex: 0 0 auto;
      color: #fff; font-size: 25px; border-radius: 16px;
      background: linear-gradient(145deg, #6ab6ff, #4778ec);
      box-shadow: 0 7px 16px rgba(65, 123, 236, .25);
    }
    h1 { margin: 0; font-size: clamp(21px, 3vw, 27px); line-height: 1.15; letter-spacing: .02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-weight: 600; }
    .class-pill { display: flex; align-items: center; gap: 7px; padding: 9px 14px; border: 1px solid #e7edf5; border-radius: 999px; color: #56718c; background: rgba(255,255,255,.72); font-size: 13px; font-weight: 800; white-space: nowrap; }
    .class-pill span { font-size: 16px; }

    .game-card { overflow: hidden; padding: 19px; border: 1px solid rgba(222,231,243,.9); border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
    .hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin: 0 2px 15px; }
    .hud-block { min-width: 0; }
    .hud-block:last-child { text-align: right; }
    .eyebrow { display: block; margin-bottom: 3px; color: #8a99ad; font-size: 11px; font-weight: 900; letter-spacing: .11em; }
    .hud-value { color: #30445f; font-size: 18px; font-weight: 900; }
    .level-track { display: flex; justify-content: center; gap: 7px; }
    .level-dot { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; color: #94a3b8; background: #eef2f7; font-size: 12px; font-weight: 900; transition: .25s ease; }
    .level-dot.current { color: #fff; background: var(--blue); box-shadow: 0 3px 9px rgba(64,120,239,.28); transform: translateY(-2px); }
    .level-dot.done { color: #fff; background: #34b68a; }
    .question-bar { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; margin-bottom: 13px; padding: 9px 16px; border-radius: 15px; background: #f5f8ff; }
    .question-icon { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; color: #497be5; border-radius: 11px; background: #e6efff; font-size: 19px; font-weight: 900; }
    .question-copy { text-align: center; }
    .question-label { color: #8495ad; font-size: 11px; font-weight: 900; letter-spacing: .08em; }
    #question { margin-top: 1px; color: #263e5c; font-size: clamp(19px, 3.4vw, 25px); font-weight: 1000; letter-spacing: .035em; }
    .feedback { min-width: 76px; color: #71839b; font-size: 13px; font-weight: 900; text-align: center; }
    .feedback.good { color: #17976e; }
    .feedback.bad { color: #e17a43; }
    .board-wrap { position: relative; overflow: hidden; border-radius: 18px; background: #d7efff; box-shadow: inset 0 0 0 1px rgba(103,153,196,.14); }
    #game-container { width: 100%; line-height: 0; }
    #game-container canvas { display: block; width: 100% !important; height: auto !important; border-radius: 18px; }
    .overlay { position: absolute; z-index: 4; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(26, 50, 79, .25); backdrop-filter: blur(3px); }
    .overlay[hidden] { display: none; }
    .overlay-card { width: min(400px, 100%); padding: 25px 25px 22px; border: 1px solid rgba(255,255,255,.8); border-radius: 22px; background: rgba(255,255,255,.97); box-shadow: 0 18px 45px rgba(28,56,91,.22); text-align: center; line-height: 1.5; animation: pop .24s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(7px) scale(.97); } to { opacity: 1; transform: none; } }
    .overlay-emoji { font-size: 44px; line-height: 1; }
    .overlay-card h2 { margin: 11px 0 6px; font-size: 25px; }
    .overlay-card p { margin: 0 auto 18px; max-width: 320px; color: #71839b; font-size: 14px; font-weight: 650; }
    .primary-btn { min-height: 46px; padding: 0 23px; border: 0; border-radius: 13px; color: white; background: linear-gradient(135deg, #5588f2, #3c6fe1); box-shadow: 0 6px 14px rgba(60,111,225,.27); font-weight: 900; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 9px 18px rgba(60,111,225,.33); }
    .instructions { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 14px 3px 0; }
    .instruction-copy { color: #71839b; font-size: 13px; font-weight: 750; }
    .instruction-copy strong { color: #425a78; }
    .keycaps { display: flex; align-items: center; gap: 4px; color: #8291a6; font-size: 11px; font-weight: 900; white-space: nowrap; }
    kbd { display: inline-grid; place-items: center; min-width: 23px; height: 23px; padding: 0 5px; border: 1px solid #dce5ef; border-bottom-width: 2px; border-radius: 6px; color: #526a87; background: #fff; font: inherit; }
    .below { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 14px 2px 0; color: #8796aa; font-size: 12px; font-weight: 750; }
    .score-note { display: inline-flex; align-items: center; gap: 7px; }
    .score-note b { color: #4a6588; }
    .touch-controls { display: none; align-items: center; justify-content: center; margin: 14px auto 0; }
    .dpad { display: grid; grid-template-columns: 46px 46px 46px; grid-template-rows: 42px 42px 42px; gap: 4px; }
    .pad-btn { display: grid; place-items: center; touch-action: none; user-select: none; border: 1px solid #dce5ef; border-radius: 12px; color: #597391; background: #f6f9ff; font-size: 19px; font-weight: 900; box-shadow: 0 2px 0 #e4ebf4; }
    .pad-btn:active, .pad-btn.pressed { color: white; border-color: #5483e7; background: #5483e7; }
    .pad-up { grid-area: 1 / 2; } .pad-left { grid-area: 2 / 1; } .pad-down { grid-area: 2 / 2; } .pad-right { grid-area: 2 / 3; }
    @media (max-width: 680px) {
      body { padding: 15px 10px 22px; }
      .topbar { margin-bottom: 12px; }
      .brand-mark { width: 42px; height: 42px; border-radius: 14px; font-size: 22px; }
      .subtitle { font-size: 11px; }
      .class-pill { padding: 8px 10px; font-size: 11px; }
      .game-card { padding: 11px; border-radius: 19px; }
      .hud { gap: 7px; margin-bottom: 10px; }
      .hud-value { font-size: 15px; }
      .eyebrow { font-size: 9px; }
      .level-track { gap: 4px; }
      .level-dot { width: 23px; height: 23px; font-size: 10px; }
      .question-bar { min-height: 53px; gap: 6px; margin-bottom: 9px; padding: 7px; }
      .question-icon { width: 30px; height: 30px; }
      .feedback { min-width: 51px; font-size: 11px; }
      .board-wrap, #game-container canvas { border-radius: 13px; }
      .instructions { margin-top: 11px; }
      .instruction-copy { font-size: 11px; }
      .keycaps { display: none; }
      .below { margin-top: 10px; font-size: 11px; }
      .touch-controls { display: flex; }
    }
    @media (max-width: 380px) { .subtitle { display: none; } .class-pill { font-size: 10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><h1>算術小勇者</h1><p class="subtitle">Math Quest · 蒐集答案，勇闖數學島！</p></div>
      </div>
      <div class="class-pill"><span aria-hidden="true">🌟</span> 國小數學闖關</div>
    </header>

    <section class="game-card" aria-label="數學闖關遊戲">
      <div class="hud">
        <div class="hud-block"><span class="eyebrow">目前關卡</span><div class="hud-value" id="level-label">準備出發</div></div>
        <div class="level-track" id="level-track" aria-label="五個關卡進度"></div>
        <div class="hud-block"><span class="eyebrow">冒險得分</span><div class="hud-value"><span id="score">0</span><span style="font-size:13px;color:#8495ad"> 分</span></div></div>
      </div>

      <div class="question-bar" aria-live="polite">
        <div class="question-icon" aria-hidden="true">?</div>
        <div class="question-copy"><div class="question-label">想一想，找到正確答案</div><div id="question">準備開始你的數學冒險！</div></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="board-wrap">
        <div id="game-container" aria-label="用方向鍵移動角色並碰觸答案寶石"></div>
        <div class="overlay" id="start-overlay">
          <div class="overlay-card">
            <div class="overlay-emoji" aria-hidden="true">🧭</div>
            <h2>準備好出發了嗎？</h2>
            <p>移動小勇者，碰一碰你認為正確的答案寶石。答對加 10 分，答錯扣 5 分，完成五關就能找到寶藏！</p>
            <button class="primary-btn" id="start-button">開始第一關 →</button>
          </div>
        </div>
        <div class="overlay" id="win-overlay" hidden>
          <div class="overlay-card">
            <div class="overlay-emoji" aria-hidden="true">🏆</div>
            <h2>五關全數完成！</h2>
            <p id="win-copy">你成功找到了數學寶藏！</p>
            <button class="primary-btn" id="restart-button">再玩一次 ↻</button>
          </div>
        </div>
      </div>

      <div class="instructions">
        <div class="instruction-copy">帶著 <strong>小勇者</strong> 去碰觸正確答案，繼續前進！</div>
        <div class="keycaps"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span style="margin-left:5px">或 W A S D 移動</span></div>
      </div>
      <div class="touch-controls" aria-label="觸控方向控制">
        <div class="dpad">
          <button class="pad-btn pad-up" data-dir="up" aria-label="向上">▲</button>
          <button class="pad-btn pad-left" data-dir="left" aria-label="向左">◀</button>
          <button class="pad-btn pad-down" data-dir="down" aria-label="向下">▼</button>
          <button class="pad-btn pad-right" data-dir="right" aria-label="向右">▶</button>
        </div>
      </div>
      <div class="below">
        <div class="score-note"><span>✨</span><span><b>答對 +10 分</b>　·　答錯 −5 分</span></div>
        <div>不趕時間，慢慢想也可以！</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const W = 960, H = 500;
      const questions = [
        { text: '3 ＋ 4 ＝ ？', answer: 7, choices: [6, 7, 8] },
        { text: '12 − 5 ＝ ？', answer: 7, choices: [6, 17, 7] },
        { text: '4 × 3 ＝ ？', answer: 12, choices: [14, 7, 12] },
        { text: '20 ÷ 4 ＝ ？', answer: 5, choices: [6, 4, 5] },
        { text: '15 − 6 ＋ 4 ＝ ？', answer: 13, choices: [12, 14, 13] }
      ];
      const scoreEl = document.getElementById('score');
      const levelLabel = document.getElementById('level-label');
      const questionEl = document.getElementById('question');
      const feedbackEl = document.getElementById('feedback');
      const startOverlay = document.getElementById('start-overlay');
      const winOverlay = document.getElementById('win-overlay');
      const track = document.getElementById('level-track');
      const dots = [];
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement('div');
        dot.className = 'level-dot'; dot.textContent = i + 1;
        track.appendChild(dot); dots.push(dot);
      }

      const palette = {
        sky: 0xade4ff, grass: 0x8edba8, grassLight: 0xb0edaa,
        path: 0xf5e8bd, hill: 0x73c995, deep: 0x479b73,
        blue: 0x5e9df5, purple: 0x9d7bf3, pink: 0xf681a4,
        yellow: 0xffd264, white: 0xffffff, ink: 0x38556f
      };

      class QuestScene extends Phaser.Scene {
        constructor() { super('QuestScene'); this.pad = { up:false, down:false, left:false, right:false }; this.running = false; this.stepLock = false; }
        create() {
          this.physics.world.setBounds(30, 28, W - 60, H - 56);
          this.drawIsland();
          this.createPlayer();
          this.keys = this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');
          this.input.keyboard.on('keydown', event => {
            if (event.code === 'Space' && !this.running) this.begin();
          });
          this.answers = [];
          this.showIdleScene();
          this.events.on('shutdown', () => this.input.keyboard.removeAllListeners());
        }
        drawIsland() {
          const g = this.add.graphics();
          g.fillGradientStyle(palette.sky, palette.sky, 0xd6f5ff, 0xd6f5ff, 1); g.fillRect(0,0,W,H);
          // soft distant clouds
          [[95,82,1],[822,91,.82],[710,67,.62],[254,105,.55]].forEach(([x,y,s]) => {
            const c = this.add.container(x,y).setAlpha(.75);
            c.add([this.add.ellipse(-17*s,2*s,43*s,16*s,0xffffff), this.add.ellipse(0,-3*s,31*s,22*s,0xffffff), this.add.ellipse(18*s,3*s,37*s,14*s,0xffffff)]);
            c.setDepth(0);
          });
          // floating island
          g.fillStyle(0x659f9a, .24); g.fillEllipse(W/2, 491, 770, 38);
          g.fillStyle(palette.deep,1); g.fillEllipse(W/2,450,858,104);
          g.fillStyle(palette.grass,1); g.fillEllipse(W/2,419,882,111);
          g.fillStyle(palette.grassLight,.7); g.fillEllipse(W/2,400,795,95);
          // sandy winding path
          g.lineStyle(72, palette.path, 1); g.beginPath(); g.moveTo(475,458); g.lineTo(485,380); g.lineTo(450,315); g.lineTo(477,250); g.lineTo(490,188); g.strokePath();
          g.lineStyle(5, 0xfff7dd, .62); g.beginPath(); g.moveTo(475,458); g.lineTo(485,380); g.lineTo(450,315); g.lineTo(477,250); g.lineTo(490,188); g.strokePath();
          // small grassy patches and pebble accents, kept clear of answers
          const sprinkles = [
            [112,247,0xf8cf66],[161,373,0xfa829d],[278,157,0xffffff],[337,390,0xffd264],
            [624,382,0xffffff],[690,283,0xf8cf66],[791,369,0xfa829d],[859,222,0xffffff],
            [127,427,0xffffff],[827,425,0xffd264],[305,293,0xffffff],[665,177,0xfa829d]
          ];
          sprinkles.forEach(([x,y,color],i) => {
            const flower = this.add.container(x,y).setDepth(1);
            const petals = [];
            for (let n=0;n<5;n++) petals.push(this.add.circle(Math.cos(n*Math.PI*2/5)*5,Math.sin(n*Math.PI*2/5)*5,3.4,color));
            petals.push(this.add.circle(0,0,2.8,0xffd264));
            flower.add(petals); flower.setScale(i%3===0?1.15:.85);
          });
          // path stones
          [[465,365],[486,290],[476,226],[454,338],[500,253]].forEach(([x,y],i) => {
            g.fillStyle(i%2?0xd8c694:0xe6d6aa,.8); g.fillEllipse(x,y,17,9);
          });
          // border and little pennants
          g.lineStyle(3,0xffffff,.72); g.strokeRoundedRect(14,14,W-28,H-28,26);
          const pennants = [[56,54,palette.pink],[904,55,palette.purple],[65,444,palette.yellow],[896,444,palette.blue]];
          pennants.forEach(([x,y,color]) => {
            this.add.circle(x,y,13,0xffffff,.8).setDepth(2);
            this.add.star(x,y,4,4,8,color,1).setDepth(2);
          });
        }
        createPlayer() {
          const shadow = this.add.ellipse(0,16,35,12,0x3e755e,.23);
          const body = this.add.ellipse(0,0,35,38,0x4b84e9);
          const belly = this.add.ellipse(0,5,22,23,0xeaf4ff);
          const hood = this.add.arc(0,-2,23,205,335,false,0x315fbe,1).setStrokeStyle(5,0x315fbe,1);
          const face = this.add.ellipse(0,-6,23,19,0xffd8a6);
          const eyeL = this.add.circle(-5,-7,2,0x33425c), eyeR = this.add.circle(5,-7,2,0x33425c);
          const smile = this.add.arc(0,-3,9,20,155,false,0xa85255,1).setStrokeStyle(1.5,0xa85255,1);
          const pack = this.add.rectangle(-15,5,9,18,0xf1a74f).setRounded(4);
          const tuft = this.add.triangle(0,-17,-5,2,0,-8,5,2,0xffd264);
          const avatar = this.add.container(0,0,[pack,body,belly,hood,face,eyeL,eyeR,smile,tuft]);
          this.player = this.add.container(480,428,[shadow,avatar]).setDepth(5);
          this.playerVisual = avatar;
          this.physics.add.existing(this.player);
          this.player.body.setCircle(15, -15, -14).setCollideWorldBounds(true).setMaxVelocity(240,240);
          this.tweens.add({ targets: this.playerVisual, y: -4, duration: 520, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        }
        showIdleScene() {
          this.player.setPosition(480,428); this.player.body.setVelocity(0,0);
          this.drawAnswerDecor(false);
        }
        drawAnswerDecor(active) {
          // Replace the previous round's answer and pedestal objects.
          this.answers.forEach(a => { if (a && a.active) a.destroy(); });
          this.answers = [];
          if (!this.landmarkDecor) this.landmarkDecor = [];
          this.landmarkDecor.forEach(o => { this.tweens.killTweensOf(o); o.destroy(); });
          this.landmarkDecor = [];
          const points = [[250,203],[480,151],[710,203]];
          points.forEach(([x,y],i) => {
            const ring = this.add.ellipse(x,y+19,100,22,0xffffff,.32).setDepth(1);
            const base = this.add.ellipse(x,y+12,68,18,0x86b58b,.65).setDepth(1);
            const glow = this.add.circle(x,y,42,[0x72b6ff,0xbd9bff,0xffa5bc][i],.16).setDepth(2);
            const stake = this.add.ellipse(x,y+8,43,17,0x829d83,.65).setDepth(2);
            this.landmarkDecor.push(ring,base,glow,stake);
            if (!active) {
              const halo=this.add.circle(x,y-2,23,0xffffff,.88).setDepth(3);
              const star=this.add.star(x,y-2,5,7,15,[palette.blue,palette.purple,palette.pink][i],1).setDepth(4);
              this.landmarkDecor.push(halo,star);
            }
            this.tweens.add({targets: glow, scale: {from: .88, to:1.12}, alpha: {from:.11,to:.22}, duration: 1100+i*140, yoyo:true, repeat:-1, ease:'Sine.easeInOut'});
            if (active) this.makeAnswer(x,y,i);
            else this.answers.push({active:false, destroy:()=>{ring.destroy();base.destroy();glow.destroy();stake.destroy();}});
          });
        }
        makeAnswer(x,y,index) {
          const colors = [0x5d9df5,0x9d7bf3,0xf27fa3];
          const color=colors[index];
          const shadow=this.add.ellipse(0,21,57,17,0x366b72,.22);
          const pedestal=this.add.ellipse(0,12,68,22,0x91b493,1);
          const pedestalTop=this.add.ellipse(0,7,61,17,0xb6d5a8,1);
          const glow=this.add.circle(0,-2,36,color,.14);
          const gem=this.add.polygon(0,-1,[0,-31,19,-17,16,10,0,22,-16,10,-19,-17],color,1);
          gem.setStrokeStyle(2,0xffffff,.85);
          const shine=this.add.triangle(-7,-10,-4,2,5,2,0,11,0xffffff,.45);
          const badge=this.add.circle(24,-27,18,0xffffff,.98);
          const label=this.add.text(24,-27,String(questions[this.round].choices[index]),{
            fontFamily:'Nunito, system-ui, sans-serif',fontSize:'28px',fontStyle:'900',color:'#30445f'
          }).setOrigin(.5).setResolution(2);
          const obj=this.add.container(x,y,[shadow,pedestal,pedestalTop,glow,gem,shine,badge,label]).setDepth(3);
          obj.answer=questions[this.round].choices[index]; obj.choiceIndex=index;
          this.physics.add.existing(obj,true); obj.body.setCircle(29, -29,-31);
          this.physics.add.overlap(this.player,obj,()=>this.collectAnswer(obj),null,this);
          this.tweens.add({targets:obj,y:y-5,duration:900+index*120,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});
          this.answers.push(obj);
        }
        begin() {
          if (this.running) return;
          this.running=true; this.round=0; this.score=0; this.stepLock=false;
          this.player.setPosition(480,428); this.player.body.reset(480,428);
          startOverlay.hidden=true; winOverlay.hidden=true;
          this.paintRound();
        }
        paintRound() {
          const q=questions[this.round];
          scoreEl.textContent=String(this.score);
          levelLabel.textContent=`第 ${this.round+1} 關 / 5`;
          questionEl.textContent=q.text;
          feedbackEl.textContent=''; feedbackEl.className='feedback';
          dots.forEach((d,i)=>{ d.className='level-dot'+(i<this.round?' done':i===this.round?' current':''); });
          this.drawAnswerDecor(true);
          this.player.setPosition(480,428); this.player.body.reset(480,428);
        }
        collectAnswer(obj) {
          if (!this.running || this.stepLock || !obj.active) return;
          const correct=obj.answer===questions[this.round].answer;
          obj.body.enable=false;
          if (correct) {
            this.stepLock=true; this.score+=10; scoreEl.textContent=String(this.score);
            feedbackEl.textContent='答對了！＋10'; feedbackEl.className='feedback good';
            this.tweens.add({targets:obj,scale:1.55,alpha:0,duration:300,ease:'Back.easeIn',onComplete:()=>obj.destroy()});
            this.player.body.setVelocity(0,0);
            this.time.delayedCall(950,()=>{
              this.round++;
              if (this.round>=questions.length) this.finish();
              else { this.stepLock=false; this.paintRound(); }
            });
          } else {
            this.score-=5; scoreEl.textContent=String(this.score);
            feedbackEl.textContent='再想一想！−5'; feedbackEl.className='feedback bad';
            this.cameras.main.shake(120,.0028);
            this.tweens.add({targets:obj,x:obj.x+8,duration:45,yoyo:true,repeat:3,onComplete:()=>obj.destroy()});
          }
        }
        finish() {
          this.running=false; this.stepLock=false; this.player.body.setVelocity(0,0);
          this.answers.forEach(a=>{ if(a.active) a.destroy(); }); this.answers=[];
          levelLabel.textContent='全部完成！'; questionEl.textContent='你解開了所有數學謎題！';
          feedbackEl.textContent='太棒了！'; feedbackEl.className='feedback good';
          dots.forEach(d=>d.className='level-dot done');
          document.getElementById('win-copy').textContent=`你完成了五個關卡，最後得到 ${this.score} 分！`;
          winOverlay.hidden=false;
        }
        setPad(direction,down) { this.pad[direction]=down; }
        update() {
          if (!this.player || !this.player.body) return;
          if (!this.running || this.stepLock) { if (!this.running) this.player.body.setVelocity(0,0); return; }
          const k=this.keys;
          const left=k.LEFT.isDown||k.A.isDown||this.pad.left;
          const right=k.RIGHT.isDown||k.D.isDown||this.pad.right;
          const up=k.UP.isDown||k.W.isDown||this.pad.up;
          const down=k.DOWN.isDown||k.S.isDown||this.pad.down;
          const dx=(right?1:0)-(left?1:0), dy=(down?1:0)-(up?1:0);
          const speed=225, length=Math.hypot(dx,dy)||1;
          this.player.body.setVelocity(dx/length*speed,dy/length*speed);
          if (dx<0) this.player.setScale(-1,1); else if (dx>0) this.player.setScale(1,1);
        }
      }

      const game=new Phaser.Game({
        type:Phaser.AUTO, parent:'game-container', width:W, height:H,
        backgroundColor:'#ade4ff', transparent:false,
        scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
        physics:{default:'arcade',arcade:{debug:false}},
        render:{antialias:true,roundPixels:true},
        scene:[QuestScene]
      });
      const getScene=()=>game.scene.getScene('QuestScene');
      document.getElementById('start-button').addEventListener('click',()=>getScene().begin());
      document.getElementById('restart-button').addEventListener('click',()=>getScene().begin());
      document.querySelectorAll('.pad-btn').forEach(button=>{
        const dir=button.dataset.dir;
        const press=e=>{e.preventDefault();button.classList.add('pressed');getScene().setPad(dir,true);};
        const release=e=>{e.preventDefault();button.classList.remove('pressed');getScene().setPad(dir,false);};
        button.addEventListener('pointerdown',press);
        ['pointerup','pointerleave','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,release));
      });
      window.addEventListener('blur',()=>document.querySelectorAll('.pad-btn').forEach(b=>{b.classList.remove('pressed');getScene()?.setPad(b.dataset.dir,false);}));
    })();
  </script>
</body>
</html>
